services:
  halfcloud:
    image: ${HALFCLOUD_IMAGE:-ghcr.io/mbukovy/halfcloud:latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HALFCLOUD_DATA_DIR: /opt/halfcloud/data
      HALFCLOUD_ACCESS_CODE_FILE: /opt/halfcloud/data/access-code
      HALFCLOUD_SESSION_SECRET: ${HALFCLOUD_SESSION_SECRET:?HALFCLOUD_SESSION_SECRET is required}
      HALFCLOUD_HOST_ROOT: /host
      HALFCLOUD_HOST_PROC: /host/proc
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/halfcloud/data:/opt/halfcloud/data
      - /:/host:ro
      - /proc:/host/proc:ro
    expose:
      - "3000"
    networks:
      - internal

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      halfcloud:
        condition: service_healthy
    environment:
      HALFCLOUD_HOSTNAME: ${HALFCLOUD_HOSTNAME}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - /opt/halfcloud/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal

networks:
  internal:

volumes:
  caddy_data:
  caddy_config:
